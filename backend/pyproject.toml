[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management MVP Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "python-dotenv==1.0.1",
    "openai==1.58.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "bcrypt==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.0",
]
